name: Build VolleyCourt Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract VolleyCourt project
        run: |
          mkdir project
          unzip -o volleycourt-pro-android-ready.zip -d project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install project dependencies
        working-directory: project
        run: npm install

      - name: Install Capacitor
        working-directory: project
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web app
        working-directory: project
        run: npm run build

      - name: Create Android project
        working-directory: project
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VolleyCourt-Pro-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
